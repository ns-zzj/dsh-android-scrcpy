<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>scrcpy 安卓投屏 demo（多设备）</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 13px/1.5 ui-monospace, Consolas, monospace; background: #111; color: #ddd; }
  header { padding: 8px 12px; background: #1b1b1b; border-bottom: 1px solid #333; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  header b { color: #7fd; }
  #wrap { padding: 12px; display: flex; gap: 16px; align-items: flex-start; }
  video { background: #000; max-width: 420px; width: 100%; height: auto; border: 1px solid #444; cursor: crosshair; }
  aside { min-width: 300px; max-width: 460px; }
  aside div { margin-bottom: 6px; }
  .k { color: #888; }
  button, input, select { font: inherit; background: #222; color: #ddd; border: 1px solid #444; padding: 3px 8px; border-radius: 4px; }
  button:hover { background: #2c2c2c; }
  pre { margin: 0; background: #151515; border: 1px solid #333; padding: 6px; white-space: pre-wrap; }
  #diag { border-color: #2a4d4d; }
  #log { max-height: 200px; overflow: auto; margin-top: 10px; }
  .warn { color: #fb3; }
  .bad { color: #f77; }
</style>
</head>
<body>
<header>
  <span><b>scrcpy demo</b></span>
  <span class="k">设备 <select id="dev"></select></span>
  <button id="btnReload">刷新设备</button>
  <span class="k">画面：<span id="vsize">—</span></span>
  <span class="k">帧：<span id="vframes">0</span>（关键帧 <span id="vidr">0</span>）</span>
  <span class="k">速率：<span id="vrate">—</span></span>
</header>

<div id="wrap">
  <video id="v" autoplay muted playsinline></video>
  <aside>
    <div><span class="k">帧时长来源</span>
      <label><input type="checkbox" id="usePts" checked> 用 PTS 算</label>
      <label>固定 fps <input id="fps" type="number" value="10" min="1" max="120" style="width:56px"></label>
    </div>
    <div><button id="btnReconnect">重连 /stream</button>
      <span class="k">验证 GOP 缓存：应立刻出画</span></div>
    <div class="k">在画面上按住拖动 = **当前选中那台**手机的触摸。</div>

    <div style="margin-top:10px"><b>诊断</b>（出问题先看这里）</div>
    <pre id="diag">…</pre>
    <pre id="log"></pre>
  </aside>
</div>

<script src="/jmuxer.min.js"></script>
<script>
const $ = (id) => document.getElementById(id)
const log = (m, cls) => {
  const d = document.createElement('div')
  if (cls) d.className = cls
  d.textContent = new Date().toLocaleTimeString() + '  ' + m
  $('log').prepend(d)
}
const video = $('v')

// ---------------------------------------------------------------- 诊断状态
const D = { muxerErr: '', feedErr: 0, recv: 0, fed: 0, skipped: 0, codecStr: '—', codecOk: null, lastErr: '' }
video.addEventListener('error', () => {
  D.lastErr = 'video error ' + (video.error ? video.error.code + ': ' + video.error.message : '?')
  log(D.lastErr, 'bad')
})
window.addEventListener('error', (e) => log('页面脚本错误：' + e.message, 'bad'))

// ---------------------------------------------------------------- jmuxer
let muxer = null
function resetMuxer(reason) {
  try { muxer?.reset() } catch {}
  try { muxer?.destroy() } catch {}
  muxer = null
  if (typeof JMuxer === 'undefined') {
    D.muxerErr = 'JMuxer 未加载（/jmuxer.min.js 404？还是这段脚本没执行到？）'
    return log(D.muxerErr, 'bad')
  }
  try {
    muxer = new JMuxer({
      node: video, mode: 'video', flushingTime: 0, fps: Number($('fps').value) || 10,
      onError: (e) => { D.muxerErr = 'jmuxer onError：' + (e?.message || e); log(D.muxerErr, 'bad') },
    })
    D.muxerErr = ''
    log('jmuxer 重建（' + reason + '）')
  } catch (e) {
    D.muxerErr = 'new JMuxer 抛错：' + (e?.message || e)
    log(D.muxerErr, 'bad')
  }
}
resetMuxer('初始化')
$('fps').addEventListener('change', () => resetMuxer('改 fps'))

function noteConfig(payload) {
  for (let i = 0; i + 7 < payload.length; i++) {
    if (payload[i] === 0 && payload[i + 1] === 0 && payload[i + 2] === 0 && payload[i + 3] === 1 && payload[i + 4] === 0x67) {
      const h = (n) => n.toString(16).padStart(2, '0').toUpperCase()
      D.codecStr = `avc1.${h(payload[i + 5])}${h(payload[i + 6])}${h(payload[i + 7])}`
      D.codecOk = window.MediaSource ? MediaSource.isTypeSupported(`video/mp4; codecs="${D.codecStr}"`) : false
      log(`config 包 → codec ${D.codecStr}，MSE 支持=${D.codecOk}`)
      return
    }
  }
  log('config 包：没找到 SPS（0x67）', 'warn')
}

// ---------------------------------------------------------------- 设备选择
let currentSn = null
async function loadDevices(autostart) {
  let list = []
  try { list = await (await fetch('/devices')).json() } catch (e) { return log('拿设备列表失败：' + e.message, 'bad') }
  const sel = $('dev')
  sel.innerHTML = ''
  for (const d of list) {
    const o = document.createElement('option')
    o.value = d.sn
    o.textContent = `${d.sn}${d.ready ? '' : '（未就绪）'}${d.width ? '  ' + d.width + 'x' + d.height : ''}`
    sel.appendChild(o)
  }
  if (!currentSn || !list.some((d) => d.sn === currentSn)) {
    currentSn = (list.find((d) => d.ready) || list[0] || {}).sn || null
  }
  sel.value = currentSn || ''
  log(`设备列表：${list.map((d) => d.sn).join(', ') || '（空）'} → 选中 ${currentSn}`)
  if (autostart && currentSn) startStream()
}
$('dev').addEventListener('change', (e) => { currentSn = e.target.value; log('切到 ' + currentSn); startStream() })
$('btnReload').addEventListener('click', () => loadDevices(false))

// ---------------------------------------------------------------- 流读取
// host 的帧记录格式：[u32 len][u8 flags][f64 ptsUs][payload] = 13 字节头
const REC = 13, F_CONFIG = 1, F_KEY = 2, F_SESSION = 4
let aborter = null, lastPts = 0
let frames = 0, idrs = 0, bytes = 0, lastTick = performance.now(), lastBytes = 0

async function startStream() {
  aborter?.abort()
  if (!currentSn) return log('没有选中设备', 'warn')
  aborter = new AbortController()
  frames = idrs = bytes = 0; lastPts = 0
  D.recv = D.fed = D.skipped = D.feedErr = 0; D.codecStr = '—'; D.codecOk = null
  resetMuxer('切设备/重连')
  log(`连 /stream?sn=${currentSn} …`)
  let res
  try {
    res = await fetch(`/stream?sn=${encodeURIComponent(currentSn)}`, { signal: aborter.signal, cache: 'no-store' })
  } catch (e) { return log('fetch /stream 失败：' + e.message, 'bad') }
  if (!res.ok || !res.body) return log('/stream 返回 ' + res.status, 'bad')
  log('/stream 已连上')

  const reader = res.body.getReader()
  let buf = new Uint8Array(0)
  for (;;) {
    let chunk
    try { chunk = (await reader.read()).value } catch (e) { log('读流中断：' + e.message, 'warn'); break }
    if (!chunk) break
    const next = new Uint8Array(buf.length + chunk.length)
    next.set(buf); next.set(chunk, buf.length); buf = next

    while (buf.length >= REC) {
      const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength)
      const len = dv.getUint32(0)
      if (buf.length < REC + len) break
      const flags = buf[4], ptsUs = dv.getFloat64(5), payload = buf.subarray(REC, REC + len)
      D.recv++
      if (flags & F_SESSION) {
        // 分辨率变化（旋转）：必须重建解码器 —— 否则旧的 avcC 去解新分辨率的帧，画面全乱
        const dvh = new DataView(payload.buffer, payload.byteOffset, payload.byteLength)
        log(`分辨率变化 → ${dvh.getUint32(0)}x${dvh.getUint32(4)}，重建解码器`)
        lastPts = 0                    // 新实例需要一个干净的时长基准
        resetMuxer('分辨率变化')
        buf = buf.subarray(REC + len)
        continue
      }
      if (flags & F_CONFIG) noteConfig(payload)
      let duration
      if ($('usePts').checked && lastPts && ptsUs > lastPts) duration = (ptsUs - lastPts) / 1000
      if (ptsUs) lastPts = ptsUs
      if (!muxer) D.skipped++
      else {
        try { muxer.feed(duration === undefined ? { video: payload } : { video: payload, duration }); D.fed++ }
        catch (e) { D.feedErr++; D.lastErr = 'feed 抛错：' + (e?.message || e); log(D.lastErr, 'bad') }
      }
      frames++; bytes += len
      if (flags & F_KEY) idrs++
      buf = buf.subarray(REC + len)
    }
  }
  log('流结束')
}

// ---------------------------------------------------------------- 触摸
const ACTION = { down: 0, up: 1, move: 2 }
let touching = false
function sendTouch(action, e) {
  if (!currentSn) return
  const r = video.getBoundingClientRect()
  const fx = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width))
  const fy = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))
  fetch('/touch', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sn: currentSn, action: ACTION[action], fx, fy }),
  }).then((r) => { if (!r.ok) log('touch 被拒：' + r.status, 'warn') }).catch(() => {})
}
video.addEventListener('mousedown', (e) => { touching = true; sendTouch('down', e); e.preventDefault() })
video.addEventListener('mousemove', (e) => { if (touching) sendTouch('move', e) })
window.addEventListener('mouseup', (e) => { if (touching) { touching = false; sendTouch('up', e) } })

// ---------------------------------------------------------------- 诊断渲染
setInterval(async () => {
  let list = []
  try { list = await (await fetch('/status')).json() } catch {}
  const s = list.find((d) => d.sn === currentSn)
  if (s) {
    $('vsize').textContent = s.width ? `${s.width}x${s.height}` : '—'
    $('vframes').textContent = s.frames
    $('vidr').textContent = s.idrs
  }
  const now = performance.now(), dt = (now - lastTick) / 1000
  if (dt > 0.5) { $('vrate').textContent = ((bytes - lastBytes) / dt / 1024).toFixed(1) + ' KB/s'; lastTick = now; lastBytes = bytes }
  const b = video.buffered
  $('diag').textContent = [
    `页面: ${location.origin}${location.pathname}   （必须 http://127.0.0.1:8080，file:// 打不开流）`,
    `设备 ${currentSn}   全部: ${list.map((d) => `${d.sn}${d.viewers ? '·' + d.viewers + '👁' : ''}`).join('  ') || '—'}`,
    `jmuxer: ${typeof JMuxer === 'undefined' ? '❌ 未加载' : '✅'}   MediaSource: ${window.MediaSource ? '✅' : '❌'}`,
    `codec: ${D.codecStr}   MSE 支持: ${D.codecOk === null ? '（还没收到 config 包）' : (D.codecOk ? '✅' : '❌ 不支持')}`,
    `记录: 收到 ${D.recv} / feed ${D.fed} / 丢弃 ${D.skipped} / feed 错误 ${D.feedErr}`,
    `video: readyState=${video.readyState}  尺寸=${video.videoWidth}x${video.videoHeight}  buffered=${b.length}${b.length ? '(' + b.end(0).toFixed(2) + 's)' : ''}`,
    `video.error: ${video.error ? video.error.code + ' ' + video.error.message : 'null'}`,
    D.muxerErr ? '⚠️ ' + D.muxerErr : '',
    D.lastErr ? '⚠️ ' + D.lastErr : '',
  ].filter(Boolean).join('\n')
}, 1000)

$('btnReconnect').addEventListener('click', startStream)
loadDevices(true)
</script>
</body>
</html>
